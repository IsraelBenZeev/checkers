    <div class="container" style="margin-top: 2px;">
        <img class="logo" src="./files/logo.png" alt="">
        <h1 class="title">Chkeres game</h1>
        <!-- <div>

        <div class="buttons center">
            <button id="getStarted_btn btn" class="_btn guest btn btn-light">Continue as Guest</button>
            <button id="getStartef_btn btn" class="_btn btn btn-light">learn more</button>
            <button id="getStartef_btn btn" class="_btn btn btn-light">through us</button>
        </div>


        <div class="sign-up hide">
            <form>
                <h1>sign up</h1>
                <img src="./files/back.png" alt="icon back" class="back"></img>
                <div class="mb-3">
                    <label for="name" class="form-label">Enter your name</label>
                    <div class="myCard">
                        <img src="./files/user.png" alt="user icon" class="icon"></img>
                        <input type="text" id="name" class="form-control">
                    </div>
                    <p id="error_name" class="text-danger small"></p>
                </div>
                <div class="mb-3">
                    <label for="mail">Enter your e-mail</label>
                    <div class="myCard">
                        <img src="./files/mail.png" alt="user icon" class="icon"></img>
                        <input type="email" id="mail" class="form-control">
                    </div>
                    <label for="mail_again">Enter your e-mail again</label>
                    <div class="myCard">
                        <img src="./files/mail.png" alt="user icon" class="icon"></img>
                        <input type="email" id="mail_again" class="form-control">
                    </div>
                    <p id="error_mail" class="text-danger small"></p>
                </div>
                <div class="mb-3">
                    <label for="password">Enter your password</label>
                    <div class="myCard">
                        <img src="./files/password.png" alt="user icon" class="icon"></img>
                        <input type="password" id="password" class="form-control">
                        <i class="fa fa-eye icon iconShow iconShow2" aria-hidden="true"></i>
                        <i class="fa fa-eye-slash icon iconHide iconHide2 hide" aria-hidden="true"></i>
                    </div>
                    <p id="error_password" class="text-danger small"></p>
                </div>
                <button class="submit btn btn-dark my-btn w-100" style="height: 40px; padding: 0;">sign up</button>
            </form>
        </div>

        <div class="log-in">
            <form class="p-2" >
                <div class="containerTitle">
                    <h1>log in</h1>
                </div>
                <div class="mb-3">
                    <label for="name2" class="form-label">Enter your name</label>
                    <div class="myCard">
                        <img src="./files/user.png" alt="user icon" class="icon"></img>
                        <input type="text" id="name2" class="form-control">
                    </div>
                    <p id="error_name2" class="text-danger small"></p>
                </div>
                <div class="mb-3">
                    <label for="password2">Enter your password</label>
                    <div class="myCard">
                        <img src="./files/password.png  " alt="user icon" class="icon"></img>
                        <input type="password" id="password2" class="form-control">
                        <i class="fa fa-eye icon iconShow" aria-hidden="true"></i>
                        <i class="fa fa-eye-slash icon iconHide hide" aria-hidden="true"></i>
                    </div>
                    <p id="error_password2" class="text-danger small"></p>
                </div>
                <button class="submit btn btn-dark my-btn w-100 mb-2">log in</button>
                <p>אין לך חשבון? <span class="enter">צור חשבון</span></p>
            </form>
        </div>
