<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/boardClass.js"></script>
    <script src="./js/pawnClass.js"></script>

    <title>index</title>

<body class="center">
    <div class="container center">
        <img class="hamburger" src="./files/hamburger.png" alt="icon hamburger">
        <!-- <div class="information center"> -->
        <div class="name center"></div>
        <p class="txt">חיילים שנאכלו</p>
        <div class="pawns-red-ded center"></div>
        <div class="pawns-dark-ded center"></div>

        <div class="board"></div>

            <img class="logo" src="./files/logo.png" alt="">

    </div>

        <!-- <img class="close" src="./files/icon_clos.png"  alt=""> -->

        <button id="restart2" class="btn btn-dark" onclick="restart()">restart</button>
        <button class="btn btn-dark">insractions</button>
        <button class="btn btn-dark">results</button>
        <button class="btn btn-dark clear" onclick="clear()">clear</button>
